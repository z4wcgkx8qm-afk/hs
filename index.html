<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maxPLUS — Загрузка токенов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #e94560;
        }
        textarea {
            width: 100%;
            height: 250px;
            background: #16213e;
            color: #fff;
            border: 1px solid #e94560;
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
        }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="header">📥 Загрузка токенов</div>
    <textarea id="tokens" placeholder="Вставьте токены сюда..."></textarea>
    <button class="btn" onclick="submitTokens()">ГОТОВО</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function extractToken(text) {
            const match = text.match(/An_Sx6HQ9HDi[a-zA-Z0-9_\-]+/);
            return match ? match[0] : null;
        }

        function submitTokens() {
            const raw = document.getElementById('tokens').value.trim();
            if (!raw) {
                tg.showAlert('Вставьте токены');
                return;
            }

            const lines = raw.split('\n').filter(line => line.trim());
            const tokens = [];
            const invalidLines = [];

            lines.forEach((line, i) => {
                const token = extractToken(line.trim());
                if (token) {
                    tokens.push(token);
                } else {
                    invalidLines.push(i + 1);
                }
            });

            if (invalidLines.length > 0) {
                tg.showAlert(`Строки ${invalidLines.join(', ')} не распознаны как токены. Исправьте и попробуйте снова.`);
                return;
            }

            tg.sendData(JSON.stringify({ tokens }));
            tg.showAlert(`Загружено ${tokens.length} токенов`);
            tg.close();
        }
    </script>
</body>
</html>
